<svg xmlns="http://www.w3.org/2000/svg" class="ug" width="1600" height="900" viewBox="0 73 1600 900" role="img" aria-label="User groups overview"><style>
svg.ug [class^="ua-"]{transform-box:fill-box;transform-origin:center}
svg.ug .ua-up{animation:ua-up .6s cubic-bezier(.2,.7,.2,1) both}
svg.ug .ua-pop{animation:ua-pop .5s cubic-bezier(.3,1.6,.5,1) both}
svg.ug .ua-fade{animation:ua-fade .5s ease both}
svg.ug .ua-drop{animation:ua-drop .7s cubic-bezier(.3,1.4,.5,1) both}
svg.ug .ua-bar{animation:ua-bar 1.1s cubic-bezier(.3,.8,.2,1) both;transform-origin:left center}
svg.ug .ua-press{animation:ua-press .5s ease both}
svg.ug .ua-shake{animation:ua-shake .6s ease both}
svg.ug .ua-cur{animation:ua-cur 1s cubic-bezier(.3,.8,.2,1) both}
svg.ug .ua-float{animation:ua-float 3.2s ease-in-out infinite}
svg.ug .ua-pulse{animation:ua-pulse 1.8s ease-in-out infinite}
@keyframes ua-up{from{opacity:0;transform:translateY(18px)}}
@keyframes ua-pop{from{opacity:0;transform:scale(.3)}}
@keyframes ua-fade{from{opacity:0}}
@keyframes ua-drop{from{opacity:0;transform:translateY(-34px)}}
@keyframes ua-bar{from{transform:scaleX(0)}}
@keyframes ua-press{40%{transform:scale(.92)}}
@keyframes ua-shake{20%{transform:rotate(-14deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(3deg)}}
@keyframes ua-cur{from{opacity:0;transform:translate(70px,90px)}30%{opacity:1}}
@keyframes ua-float{50%{transform:translateY(-6px)}}
@keyframes ua-pulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){svg.ug *{animation:none!important}}
